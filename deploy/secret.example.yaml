# 建議用指令建，而非提交到 git：
#   kubectl create secret generic metal-push-secret \
#     --from-literal=WECOM_KEY='你的群機器人key' \
#     --from-literal=PUSH_TOKEN='自訂觸發token' \
#     -n <namespace>
apiVersion: v1
kind: Secret
metadata:
  name: metal-push-secret
type: Opaque
stringData:
  WECOM_KEY: "REPLACE_ME"
  PUSH_TOKEN: "REPLACE_ME"
